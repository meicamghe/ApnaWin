name: Windows tests and build

# Keep only the newest CI run for each branch/ref; rapid commits should not
# leave redundant Windows builds queued behind one another.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run unit tests
        run: python -m pytest -q

  # Build a Windows validation artifact for PRs after the full test suite passes.
  # This is a generic Xray client preview, not proof of APNA server compatibility.
  build-windows:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    needs: test
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and build dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run full test suite on native Windows
        run: python -m pytest -q
      - name: Build Windows desktop application
        run: python -m PyInstaller --noconfirm --clean --windowed --name ApnaWin --paths src src/apnawin/__main__.py
      - name: Build elevated Xray helper
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --uac-admin --name ApnaWinElevator --paths src src/apnawin/elevated_helper.py
          Copy-Item -LiteralPath "dist/ApnaWinElevator.exe" -Destination "dist/ApnaWin/ApnaWinElevator.exe" -Force
          Copy-Item -LiteralPath "scripts/Install-ApnaWin.ps1" -Destination "dist/ApnaWin/Install-ApnaWin.ps1" -Force
      - name: Install verified Xray and Wintun runtime
        shell: pwsh
        run: ./scripts/Install-VpnRuntime.ps1 -Destination "dist/ApnaWin/engine"
      - name: Smoke-test packaged Windows application
        run: dist/ApnaWin/ApnaWin.exe --smoke-test
      - name: Upload portable application folder
        uses: actions/upload-artifact@v4
        with:
          name: ApnaWin-Windows-x64
          path: dist/ApnaWin/
          if-no-files-found: error
          retention-days: 14
