name: Windows tests and build

# Independent validation and packaging tracks run concurrently. The final
# portable artifact is published only after every required track succeeds.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Code quality (Ruff)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install lint dependency
        run: python -m pip install "ruff>=0.6"
      - name: Check critical correctness rules
        run: python -m ruff check --select E9,F821,F823 src tests

  test:
    name: Unit and integration tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run full test suite
        run: python -m pytest -q
      - name: Non-blocking live APNA catalog reachability probe
        continue-on-error: true
        run: >-
          python -c "from apnawin.services.apna_lite_source import ApnaLiteCatalogSource;
          print(ApnaLiteCatalogSource(timeout_seconds=8.0, retry_attempts=2).fetch_summary())"

  security-check:
    name: Installer and runtime security tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install "pytest>=8.0"
      - name: Run installer security regression tests
        run: python -m pytest -q tests/test_installer_security.py
      - name: Verify Python sources compile
        run: python -m compileall -q src

  build-windows:
    name: Windows x64 packaging
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and build dependencies
        run: python -m pip install -e ".[dev]"
      - name: Build Windows desktop application
        run: python -m PyInstaller --noconfirm --clean --windowed --name ApnaWin --paths src src/apnawin/__main__.py
      - name: Build elevated Xray helper
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --uac-admin --name ApnaWinElevator --paths src src/apnawin/elevated_helper.py
          Copy-Item -LiteralPath "dist/ApnaWinElevator.exe" -Destination "dist/ApnaWin/ApnaWinElevator.exe" -Force
          Copy-Item -LiteralPath "scripts/Install-ApnaWin.ps1" -Destination "dist/ApnaWin/Install-ApnaWin.ps1" -Force
      - name: Install verified Xray and Wintun runtime
        shell: pwsh
        run: ./scripts/Install-VpnRuntime.ps1 -Destination "dist/ApnaWin/engine"
      - name: Smoke-test packaged Windows application
        run: dist/ApnaWin/ApnaWin.exe --smoke-test
      - name: Upload internal build candidate
        uses: actions/upload-artifact@v4
        with:
          name: ApnaWin-Windows-x64-staging
          path: dist/ApnaWin/
          if-no-files-found: error
          retention-days: 1


  vpn-readiness:
    name: VPN runtime readiness and egress tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install "pytest>=8.0"
      - name: Validate TUN startup, dual-stack routes, DNS, egress and supervision
        run: >-
          python -m pytest -q
          tests/test_elevated_xray.py
          tests/test_windows_tunnel_diagnostics.py
          tests/test_windows_tunnel_egress.py
          tests/test_xray_tunnel_supervisor.py
          tests/test_xray_process.py
          tests/test_windows_network_transaction.py
          tests/test_windows_tunnel_diagnostics_integration.py
          tests/test_xray_graceful_stop.py
          tests/test_xray_tunnel_engine.py

  publish-windows:
    name: Publish verified portable artifact
    needs: [lint, test, security-check, vpn-readiness, build-windows]
    runs-on: windows-latest
    steps:
      - name: Download successful Windows build candidate
        uses: actions/download-artifact@v4
        with:
          name: ApnaWin-Windows-x64-staging
          path: dist/ApnaWin
      - name: Verify required packaged files
        shell: pwsh
        run: |
          $required = @(
            "dist/ApnaWin/ApnaWin.exe",
            "dist/ApnaWin/ApnaWinElevator.exe",
            "dist/ApnaWin/engine/xray.exe",
            "dist/ApnaWin/engine/wintun.dll",
            "dist/ApnaWin/engine/runtime-manifest.json"
          )
          foreach ($file in $required) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Required packaged file is missing: $file"
            }
          }
      - name: Upload verified portable application
        uses: actions/upload-artifact@v4
        with:
          name: ApnaWin-Windows-x64
          path: dist/ApnaWin/
          if-no-files-found: error
          retention-days: 14
