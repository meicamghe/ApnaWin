name: Windows tests and runtime checks (no packaging)

# This workflow intentionally validates source and tests only. Product packaging
# and artifact publication remain disabled until explicitly authorized.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Code quality (Ruff)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install lint dependency
        run: python -m pip install "ruff>=0.6"
      - name: Check critical correctness rules
        run: python -m ruff check --select E9,F821,F823 src tests

  test:
    name: Unit and integration tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run full test suite
        run: python -m pytest -q
      - name: Non-blocking live APNA catalog reachability probe
        continue-on-error: true
        run: >-
          python -c "from apnawin.services.apna_lite_source import ApnaLiteCatalogSource;
          print(ApnaLiteCatalogSource(timeout_seconds=8.0, retry_attempts=2).fetch_summary())"

  security-check:
    name: Installer and runtime security tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install "pytest>=8.0"
      - name: Run installer security regression tests
        run: python -m pytest -q tests/test_installer_security.py
      - name: Verify Python sources compile
        run: python -m compileall -q src

  xray-config-compat:
    name: Pinned Xray share-link config compatibility
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Download and verify the exact bundled Xray runtime
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "xray-windows-64.zip"
          $destination = Join-Path $env:RUNNER_TEMP "xray-runtime"
          $url = "https://github.com/XTLS/Xray-core/releases/download/v26.11.9/Xray-windows-64.zip"
          $expected = "1262522266337b824f07beb8e1375786b437683b3890105469088f8e17e0a69d"
          Invoke-WebRequest -Uri $url -OutFile $archive
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Pinned Xray archive SHA-256 mismatch: $actual" }
          Expand-Archive -LiteralPath $archive -DestinationPath $destination -Force
          $executable = Join-Path $destination "xray.exe"
          if (-not (Test-Path -LiteralPath $executable -PathType Leaf)) { throw "xray.exe missing from verified archive" }
          $version = (& $executable version 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0 -or $version -notmatch "26.11.9") { throw "Unexpected Xray runtime version: $version" }
          "APNAWIN_XRAY_EXECUTABLE=$executable" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Validate imported share-link configs with the real Xray runtime
        run: python -m pytest -q tests/test_xray_share_link.py -k pinned_xray_runtime

  vpn-readiness:
    name: VPN runtime readiness and egress tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install "pytest>=8.0"
      - name: Validate TUN startup, dual-stack routes, DNS, egress and supervision
        run: >-
          python -m pytest -q
          tests/test_elevated_xray.py
          tests/test_windows_tunnel_diagnostics.py
          tests/test_windows_tunnel_egress.py
          tests/test_xray_tunnel_supervisor.py
          tests/test_xray_process.py
          tests/test_windows_network_transaction.py
          tests/test_windows_tunnel_diagnostics_integration.py
          tests/test_xray_graceful_stop.py
          tests/test_xray_tunnel_engine.py
