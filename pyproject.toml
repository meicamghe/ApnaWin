[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apnawin"
version = "0.1.0"
description = "A native Windows tunneling client project inspired by APNA TUNNEL LITE workflows."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary - see LICENSE status in repository" }
dependencies = ["PySide6>=6.7"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "pyinstaller>=6.0"]

[project.scripts]
apnawin = "apnawin.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
